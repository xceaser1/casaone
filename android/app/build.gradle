plugins {
    id 'com.android.application'
}

// Signature de production.
//
// La cle N'EST PAS versionnee : elle vit dans keystore.properties, a la racine
// du projet et ignore par git. Sans ce fichier, le build de release retombe sur
// la signature de debogage, ce qui permet de compiler sans avoir la cle.
//
// Perdre cette cle rend toute mise a jour impossible : les utilisateurs
// devraient desinstaller l'application, et perdraient leurs pointages en
// attente d'envoi. Elle doit etre sauvegardee hors de cette machine.
def fichierCle = rootProject.file("keystore.properties")
def proprietesCle = new Properties()
if (fichierCle.exists()) {
    fichierCle.withInputStream { proprietesCle.load(it) }
}

android {
    namespace 'com.urbagec.casaone'
    compileSdk 34

    defaultConfig {
        applicationId "com.urbagec.casaone"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
        // Adresse par defaut : le deploiement en ligne, joignable de partout et
        // muni d'un vrai certificat. L'ancienne valeur pointait vers le poste de
        // developpement via Tailscale : elle n'aboutissait que si ce poste
        // faisait tourner le serveur ET que le telephone etait sur Tailscale.
        // Reste modifiable dans l'application (menu ou ecran d'erreur).
        buildConfigField "String", "URL_DEFAUT", "\"https://casaone.onrender.com\""
    }

    signingConfigs {
        release {
            if (proprietesCle.containsKey("storeFile")) {
                storeFile rootProject.file(proprietesCle["storeFile"])
                storePassword proprietesCle["storePassword"]
                keyAlias proprietesCle["keyAlias"]
                keyPassword proprietesCle["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (proprietesCle.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Lecture des badges : le decodeur embarque de ML Kit (aucun service en
    // ligne, aucun compte a creer) est nettement plus tolerant que jsQR en
    // basse lumiere et sur badge abime.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Verification periodique en tache de fond : alimente les notifications et
    // la tuile de l'ecran d'accueil.
    implementation 'androidx.work:work-runtime:2.9.1'
}
